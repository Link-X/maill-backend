server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_results%3Dutf8mb4%2Ccharacter_set_client%3Dutf8mb4%2Ccharacter_set_connection%3Dutf8mb4
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Publisher Confirm：消息到达 Exchange 时 broker 回调；nack 即视为投递失败
    publisher-confirm-type: correlated
    # Publisher Returns：消息到达 Exchange 但路由不到 Queue 时回调；配合 mandatory=true 生效
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

snowflake:
  worker-id: 1
  data-center-id: 1

jwt:
  # 仅限 dev 环境默认值；生产必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:ticket-system-secret-key-must-be-at-least-256-bits!!}
  # token 过期时间(ms),默认 2 小时
  expire-ms: ${JWT_EXPIRE_MS:7200000}

# 跨域允许的前端 origin(逗号分隔)。新前端端口请在这里追加,避免出现 CORS preflight 拒绝。
# 生产环境用 application-prod.yml 中的 ${CORS_ALLOWED_ORIGINS} 环境变量注入。
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

logging:
  level:
    com.ticket: DEBUG

# SpringDoc OpenAPI（开发环境暴露 /swagger-ui.html）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Ticket User API
    description: 用户端 REST API（演出 / 场次 / 分类 / 城市 / 下单 / 支付 / 入场核验）
    version: 1.0.0

# Elasticsearch (本地 docker-compose)
elasticsearch:
  host: localhost:9200
  connect-timeout-ms: 3000
  socket-timeout-ms: 10000

# MinIO (用户评价晒图上传)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: image
  # 浏览器访问 URL 用的 host，本地与 endpoint 相同；线上可换 CDN 或反向代理域名
  public-endpoint: http://localhost:9000
