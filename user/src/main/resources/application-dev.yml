server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

snowflake:
  worker-id: 1
  data-center-id: 1

jwt:
  # 仅限 dev 环境默认值；生产必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:ticket-system-secret-key-must-be-at-least-256-bits!!}
  # token 过期时间(ms),默认 2 小时
  expire-ms: ${JWT_EXPIRE_MS:7200000}

logging:
  level:
    com.ticket: DEBUG
