server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

snowflake:
  # 必须通过 SNOWFLAKE_WORKER_ID 环境变量注入,每副本唯一(0-31),未配置启动会报错
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: 1

jwt:
  # 生产必须显式注入 JWT_SECRET 环境变量,未配置启动会报错
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

cors:
  # 允许跨域的前端 origin 列表(逗号分隔),生产环境必须显式配置,禁止 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

elasticsearch:
  host: ${ES_HOST:localhost}:${ES_PORT:9200}
  connect-timeout-ms: ${ES_CONNECT_TIMEOUT:3000}
  socket-timeout-ms: ${ES_SOCKET_TIMEOUT:10000}

# MinIO 对象存储(用户评价晒图上传)
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:image}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}

logging:
  level:
    root: WARN
    com.ticket: WARN
