server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Lettuce 连接池：高 QPS 用户端需要并发 Redis 操作(座位锁/限购/会话)
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Publisher Confirm + Returns：订单超时/取消等关键消息丢失告警链路
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者并发：order.cancel / ticket.generate / 等高吞吐队列需要并行消费
        concurrency: 4
        max-concurrency: 8
        prefetch: 32
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

snowflake:
  # 必须通过 SNOWFLAKE_WORKER_ID 环境变量注入,每副本唯一(0-31),未配置启动会报错
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: 1

jwt:
  # 生产必须显式注入 JWT_SECRET 环境变量,未配置启动会报错
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

cors:
  # 允许跨域的前端 origin 列表(逗号分隔),生产环境必须显式配置,禁止 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

elasticsearch:
  host: ${ES_HOST:localhost}:${ES_PORT:9200}
  connect-timeout-ms: ${ES_CONNECT_TIMEOUT:3000}
  socket-timeout-ms: ${ES_SOCKET_TIMEOUT:10000}

# MinIO 对象存储(用户评价晒图上传)
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:image}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}

logging:
  level:
    root: WARN
    com.ticket: WARN
