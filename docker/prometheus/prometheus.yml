# Prometheus 抓取配置
# 抓取目标:user / admin / payment 三个 Spring Boot 应用的 /actuator/prometheus 端点
# 应用是宿主机进程(不在 docker 里),所以用 host.docker.internal(Mac/Win)
# 如果在 Linux 上跑,改成宿主机 IP 或者用 network_mode: host

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ticket

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ticket-user'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: ticket-user

  - job_name: 'ticket-admin'
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: ticket-admin

  - job_name: 'ticket-payment'
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: ticket-payment
