server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

snowflake:
  worker-id: 1
  data-center-id: 2

jwt:
  # 与 user 模块共享同一签发体系;dev 默认值仅供本地调试,生产必须通过 JWT_SECRET 注入
  secret: ${JWT_SECRET:ticket-system-secret-key-must-be-at-least-256-bits!!}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

admin:
  # 管理员注册邀请码,dev 默认值仅供本地调试;生产必须通过 ADMIN_INVITE_CODE 注入
  invite-code: ${ADMIN_INVITE_CODE:dev-admin-invite-please-change-in-prod}

logging:
  level:
    com.ticket: DEBUG
