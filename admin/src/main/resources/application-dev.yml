server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_results%3Dutf8mb4%2Ccharacter_set_client%3Dutf8mb4%2Ccharacter_set_connection%3Dutf8mb4
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Publisher Confirm + Returns：消息丢失告警链路
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: image
  # 浏览器访问 URL 用的 host，本地与 endpoint 相同；线上可换 CDN 或反向代理域名
  public-endpoint: http://localhost:9000

snowflake:
  worker-id: 1
  data-center-id: 2

jwt:
  # 与 user 模块共享同一签发体系;dev 默认值仅供本地调试,生产必须通过 JWT_SECRET 注入
  secret: ${JWT_SECRET:ticket-system-secret-key-must-be-at-least-256-bits!!}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

admin:
  # 管理员注册邀请码,dev 默认值仅供本地调试;生产必须通过 ADMIN_INVITE_CODE 注入
  invite-code: ${ADMIN_INVITE_CODE:dev-admin-invite-please-change-in-prod}

# 跨域允许的前端 origin(逗号分隔)。新前端端口请在这里追加,避免出现 CORS preflight 拒绝。
# 生产环境用 application-prod.yml 中的 ${CORS_ALLOWED_ORIGINS} 环境变量注入。
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

logging:
  level:
    com.ticket: DEBUG

# SpringDoc OpenAPI（开发环境暴露 /swagger-ui.html）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Ticket Admin API
    description: 管理端 REST API（演出 / 场次 / 分类 / 城市 / 场地模板 / 订单 / 监控）
    version: 1.0.0

# Elasticsearch (本地 docker-compose)
elasticsearch:
  host: localhost:9200
  connect-timeout-ms: 3000
  socket-timeout-ms: 10000

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ticket-admin
