server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

snowflake:
  # 必须通过 SNOWFLAKE_WORKER_ID 环境变量注入,每副本唯一(0-31),未配置启动会报错
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: 2

jwt:
  # 与 user 模块共享同一签发体系,生产必须显式注入 JWT_SECRET
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

admin:
  # 生产必须显式注入 ADMIN_INVITE_CODE,用于注册管理员账号(仅运维持有)
  invite-code: ${ADMIN_INVITE_CODE}

logging:
  level:
    root: WARN
    com.ticket: WARN
