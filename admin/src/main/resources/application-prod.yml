server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Publisher Confirm + Returns：admin 端搜索同步等消息丢失告警链路
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # search.sync.queue 等异步索引更新；admin 端 QPS 低，2 并发足够
        concurrency: 2
        max-concurrency: 4
        prefetch: 16

snowflake:
  # 必须通过 SNOWFLAKE_WORKER_ID 环境变量注入,每副本唯一(0-31),未配置启动会报错
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: 2

jwt:
  # 与 user 模块共享同一签发体系,生产必须显式注入 JWT_SECRET
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

admin:
  # 生产必须显式注入 ADMIN_INVITE_CODE,用于注册管理员账号(仅运维持有)
  invite-code: ${ADMIN_INVITE_CODE}

cors:
  # 允许跨域的前端 origin 列表(逗号分隔),生产环境必须显式配置,禁止 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator + Prometheus:生产必须暴露 /actuator/prometheus,否则监控抓取不到任何指标。
# 端点只应通过内网访问,不对公网开放
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ticket-admin

logging:
  level:
    root: WARN
    com.ticket: WARN
