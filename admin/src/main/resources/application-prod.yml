server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  data-center-id: 2

admin:
  # 生产必须显式注入 ADMIN_API_KEY 环境变量,未配置启动会报错
  api-key: ${ADMIN_API_KEY}

logging:
  level:
    root: WARN
    com.ticket: WARN
