server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Publisher Confirm + Returns：消息丢失告警链路（支付/退款资金消息必须不能静默丢失）
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 退款队列消费者并发：支付服务需要并行处理 refund.queue
        concurrency: 4
        max-concurrency: 8
        prefetch: 16
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

snowflake:
  # 必须通过 SNOWFLAKE_WORKER_ID 环境变量注入,每副本唯一(0-31),未配置启动会报错
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: 3

jwt:
  # 与 user/admin 共享同一签发体系,生产必须显式注入 JWT_SECRET
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

cors:
  # 允许跨域的前端 origin 列表(逗号分隔),生产环境必须显式配置,禁止 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator + Prometheus:生产必须暴露 /actuator/prometheus,否则监控抓取不到任何指标。
# 端点只应通过内网访问,不对公网开放
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ticket-payment

logging:
  level:
    root: WARN
    com.ticket: WARN
