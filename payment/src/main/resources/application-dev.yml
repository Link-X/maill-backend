server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Publisher Confirm + Returns：消息丢失告警链路（支付/退款资金消息必须不能静默丢失）
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

snowflake:
  worker-id: 1
  data-center-id: 3

jwt:
  # payment 不签发 token,但 JwtTokenProvider 在 common 中是全局 Bean,启动时需配置;
  # 与 user/admin 共享同一 secret,保证未来跨服务校验 token 一致
  secret: ${JWT_SECRET:ticket-system-secret-key-must-be-at-least-256-bits!!}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

logging:
  level:
    com.ticket: DEBUG

# Elasticsearch (本地 docker-compose)
elasticsearch:
  host: localhost:9200
  connect-timeout-ms: 3000
  socket-timeout-ms: 10000

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ticket-payment
